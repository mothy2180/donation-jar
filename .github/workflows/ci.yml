name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scaffold-checks:
    name: scaffold checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: copy-lint (banned regulatory wording in user-facing copy)
        run: scripts/copy-lint.sh
      - name: YAML parses
        run: |
          ruby -ryaml -e 'ARGV.each { |f| YAML.load_file(f); puts "ok #{f}" }' .github/workflows/*.yml .github/dependabot.yml .pre-commit-config.yaml pnpm-workspace.yaml
      - name: required files present
        run: |
          for f in PROJECT.md README.md SECURITY.md LICENSE .gitignore .nvmrc docs/adr/0001-one-backend-supabase.md; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

  secret-scan:
    name: gitleaks (full history, repo config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

